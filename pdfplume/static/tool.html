<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDFPlume</title>
  <meta name="color-scheme" content="light dark">
  <script>try{var m=JSON.parse(localStorage.getItem("pdfplume.theme"))||"system";document.documentElement.dataset.theme=(m==="dark"||(m==="system"&&matchMedia("(prefers-color-scheme: dark)").matches))?"dark":"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#5b5bd6">
  <link rel="apple-touch-icon" href="/static/img/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <script type="module" src="/static/js/tool.js"></script>
</body>
</html>
